<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub - Order History & Receipts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #999;
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-card .value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
        }

        .orders-list {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .orders-list h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .order-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid #667eea;
            transition: transform 0.3s;
        }

        .order-item:hover {
            transform: translateX(10px);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .order-number {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }

        .order-date {
            color: #999;
            font-size: 0.9rem;
        }

        .order-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .detail-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
        }

        .detail-label {
            font-size: 0.8rem;
            color: #999;
            margin-bottom: 5px;
        }

        .detail-value {
            font-weight: 600;
            color: #333;
        }

        .order-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-download {
            background: #28a745;
            color: white;
        }

        .btn-download:hover {
            background: #218838;
        }

        .btn-view {
            background: #667eea;
            color: white;
        }

        .btn-view:hover {
            background: #5568d3;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .items-list {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
        }

        .items-list h4 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .total-section {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #667eea;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍔 FoodHub Order History</h1>
            <p>View all your orders and download receipts</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Orders</h3>
                <div class="value" id="totalOrders">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Spent</h3>
                <div class="value" id="totalSpent">₹0</div>
            </div>
            <div class="stat-card">
                <h3>Last Order</h3>
                <div class="value" id="lastOrderDate">-</div>
            </div>
        </div>

        <div class="orders-list">
            <h2>Your Orders</h2>
            <div id="ordersContainer">
                <!-- Orders will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        // Load orders from localStorage
        function loadOrders() {
            const receipts = JSON.parse(localStorage.getItem('foodhub_receipts') || '[]');
            return receipts;
        }

        // Display orders
        function displayOrders() {
            const orders = loadOrders();
            const container = document.getElementById('ordersContainer');

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No orders yet</h3>
                        <p>Start ordering delicious food from FoodHub!</p>
                        <button class="btn btn-view" onclick="window.location.href='index.html'" style="margin-top: 20px;">
                            Go to Menu
                        </button>
                    </div>
                `;
                updateStats([]);
                return;
            }

            // Sort by date (newest first)
            orders.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            container.innerHTML = orders.map(order => `
                <div class="order-item">
                    <div class="order-header">
                        <div>
                            <div class="order-number">Order #${order.orderNumber}</div>
                            <div class="order-date">${new Date(order.timestamp).toLocaleString('en-IN')}</div>
                        </div>
                        <div style="font-size: 1.5rem; font-weight: bold; color: #28a745;">
                            ₹${order.total.toLocaleString('en-IN')}
                        </div>
                    </div>

                    <div class="order-details">
                        <div class="detail-item">
                            <div class="detail-label">Customer</div>
                            <div class="detail-value">${order.customerName}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Email</div>
                            <div class="detail-value">${order.customerEmail}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Payment Method</div>
                            <div class="detail-value">${formatPaymentMethod(order.paymentMethod)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Transaction ID</div>
                            <div class="detail-value" style="font-size: 0.85rem;">${order.transactionId || 'N/A'}</div>
                        </div>
                    </div>

                    <div class="items-list">
                        <h4>Order Items (${order.items.length})</h4>
                        ${order.items.map(item => `
                            <div class="item-row">
                                <span>${item.name} × ${item.quantity}</span>
                                <span>₹${(item.price * item.quantity).toLocaleString('en-IN')}</span>
                            </div>
                        `).join('')}
                        <div class="total-section">
                            <span>Total:</span>
                            <span style="color: #28a745;">₹${order.total.toLocaleString('en-IN')}</span>
                        </div>
                    </div>

                    <div class="order-actions">
                        <button class="btn btn-download" onclick="downloadReceipt('${order.orderNumber}')">
                            📄 Download PDF
                        </button>
                        <button class="btn btn-view" onclick="viewReceipt('${order.orderNumber}')">
                            👁️ View Receipt
                        </button>
                    </div>
                </div>
            `).join('');

            updateStats(orders);
        }

        // Update statistics
        function updateStats(orders) {
            document.getElementById('totalOrders').textContent = orders.length;
            
            const total = orders.reduce((sum, order) => sum + order.total, 0);
            document.getElementById('totalSpent').textContent = `₹${total.toLocaleString('en-IN')}`;
            
            if (orders.length > 0) {
                const lastOrder = orders[0];
                document.getElementById('lastOrderDate').textContent = new Date(lastOrder.timestamp).toLocaleDateString('en-IN');
            }
        }

        // Format payment method
        function formatPaymentMethod(method) {
            const methods = {
                'card': 'Credit/Debit Card',
                'razorpay': 'Razorpay',
                'paytm': 'PayTM',
                'gpay': 'Google Pay',
                'phonepe': 'PhonePe',
                'cash': 'Cash on Delivery'
            };
            return methods[method] || method;
        }

        // Download receipt
        async function downloadReceipt(orderNumber) {
            const receipts = loadOrders();
            const order = receipts.find(o => o.orderNumber === orderNumber);

            if (!order || !order.pdfBase64) {
                alert('Receipt not found!');
                return;
            }

            // Create blob from base64
            const byteCharacters = atob(order.pdfBase64);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: 'application/pdf' });

            // Download
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `FoodHub_Receipt_${orderNumber}.pdf`;
            a.click();
            window.URL.revokeObjectURL(url);

            showNotification('Receipt downloaded successfully!');
        }

        // View receipt
        function viewReceipt(orderNumber) {
            downloadReceipt(orderNumber);
        }

        // Show notification
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: #28a745;
                color: white;
                padding: 15px 25px;
                border-radius: 8px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
                z-index: 9999;
                animation: slideIn 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Initialize
        displayOrders();
    </script>
</body>
</html>
